name: IndexNow

# On every push to main: waits until GitHub Pages has deployed that commit,
# then pings IndexNow (Bing, Yandex, Seznam, Naver, ...) with the URLs whose
# source changed in the push. Run manually to submit every URL in the sitemap.
# (GitHub's built-in "pages build and deployment" run can't trigger other
# workflows, so this listens for the push and polls the Pages deployment.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: indexnow
  cancel-in-progress: false

env:
  SITE: https://carlos231.github.io
  INDEXNOW_KEY: 305d6e064dde2291b2514a6ca5c7d4c7

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find files changed in this push
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          prev="$BEFORE"
          if [ -z "$prev" ] || [ "$prev" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$prev^{commit}" 2>/dev/null; then
            prev="$GITHUB_SHA~1"
          fi
          echo "Diffing $prev..$GITHUB_SHA"
          git diff --name-only --diff-filter=AM "$prev" "$GITHUB_SHA" | tee changed.txt

      - name: Wait for the GitHub Pages deploy of this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do  # 40 x 15 s = 10 minutes
            id=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$GITHUB_SHA&environment=github-pages&per_page=1" --jq '.[0].id // empty')
            if [ -n "$id" ]; then
              # Statuses are listed newest first.
              state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1" --jq '.[0].state // empty')
              echo "Pages deployment $id: ${state:-pending}"
              case "$state" in
                # inactive = a newer deploy replaced it, so this commit is live too.
                success|inactive) exit 0 ;;
                failure|error) echo "Pages deploy ended as $state; not pinging IndexNow."; exit 1 ;;
              esac
            else
              echo "Waiting for the Pages deployment to start..."
            fi
            sleep 15
          done
          echo "Timed out waiting for the Pages deploy."
          exit 1

      - name: Submit to IndexNow
        env:
          ALL_URLS: ${{ github.event_name == 'workflow_dispatch' }}
          CACHE_BUST: ${{ github.sha }}
        run: |
          python3 - <<'EOF'
          import json, os, re, sys, urllib.error, urllib.request
          from urllib.parse import urlparse

          site, key = os.environ["SITE"], os.environ["INDEXNOW_KEY"]
          key_location = f"{site}/{key}.txt"

          def get(url):
              with urllib.request.urlopen(url, timeout=30) as r:
                  return r.read().decode()

          # The key file must be live, or IndexNow rejects the request.
          if get(f"{key_location}?v={os.environ['CACHE_BUST']}").strip() != key:
              sys.exit(f"Key file at {key_location} doesn't match INDEXNOW_KEY")

          # Only submit URLs that are in the deployed sitemap (indexable pages).
          sitemap = get(f"{site}/sitemap.xml?v={os.environ['CACHE_BUST']}")
          indexable = set(re.findall(r"<loc>(.*?)</loc>", sitemap))

          def url_for(path):
              text = open(path, encoding="utf-8", errors="ignore").read()
              fm = re.match(r"---\s*\n(.*?)\n---", text, re.S)
              m = fm and re.search(r"^permalink:\s*[\"']?([^\"'\n]+)", fm.group(1), re.M)
              if m:
                  return site + m.group(1).strip()
              url = "/" + path
              url = re.sub(r"index\.(html|md)$", "", url)
              return site + re.sub(r"\.md$", ".html", url)

          if os.environ["ALL_URLS"] == "true":
              urls = sorted(indexable)
          else:
              changed = open("changed.txt").read().split()
              site_wide = any(f == "_config.yml" or f.startswith(("_includes/", "_layouts/", "_data/"))
                              for f in changed)
              if site_wide:
                  urls = sorted(indexable)
              else:
                  pages = [f for f in changed
                           if f.endswith((".html", ".md"))
                           and not any(p.startswith((".", "_")) for p in f.split("/"))]
                  urls = sorted({url_for(f) for f in pages} & indexable)

          if not urls:
              print("No indexable URLs changed; nothing to submit.")
              sys.exit(0)

          print("Submitting:\n  " + "\n  ".join(urls))
          body = json.dumps({
              "host": urlparse(site).hostname,
              "key": key,
              "keyLocation": key_location,
              "urlList": urls,
          }).encode()
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow", data=body,
              headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"IndexNow responded {r.status}")
          except urllib.error.HTTPError as e:
              sys.exit(f"IndexNow responded {e.code}: {e.read().decode()[:500]}")
          EOF
