{%- comment -%}
  GoatCounter page views plus click events on App Store links (data-goatcounter-click attributes).
  Renders nothing until goatcounter_code is set in _config.yml.
{%- endcomment -%}
{%- if site.goatcounter_code and site.goatcounter_code != "" -%}
<script data-goatcounter="https://{{ site.goatcounter_code }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
{%- endif -%}
